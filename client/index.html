<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mumbai Bank · Shreya</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, monospace;

      /* surfaces + ink */
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f6f7fb;
      --surface-3: #fbfbfe;
      --dot: rgba(37, 7, 133, 0.07);
      --ink: #15161a;
      --ink-2: #52555d;
      --ink-3: #8a8d96;
      --line: #e9e9f0;
      --line-soft: #f1f1f6;

      /* primary: indigo, from the orb's anchor colour */
      --accent-50: #f0efff;
      --accent-100: #e1dfff;
      --accent-300: #bcb6fb;
      --accent-500: #6b5cf0;
      --accent-600: #5546d8;
      --accent-700: #4033b0;

      /* live + positive: teal, from the orb's colorB */
      --live: #23a7a3;
      --live-50: #e8f7f6;
      --live-100: #c8ecea;
      --ok-700: #157a72;

      /* speaker colours (from the reference bubbles) */
      --lav-bg: #ebeefc;
      --lav-bg-2: #e4e8fa;
      --lav-line: #d5dbf7;
      --lav-ink: #4150a8;
      --peach-bg: #fcefe6;
      --peach-bg-2: #f9e7da;
      --peach-line: #f3d6c1;
      --peach-ink: #a3582b;

      /* status */
      --coral: #c94b41;
      --coral-700: #b03d34;
      --amber: #a1661a;
      --amber-50: #fbf1de;
      --amber-line: #f0dcb5;
      --red: #c8413a;
      --red-50: #fcebea;
      --red-line: #f5cbc8;

      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow-sm: 0 1px 2px rgba(28, 29, 31, 0.04);
      --shadow-md: 0 30px 70px -36px rgba(37, 7, 133, 0.22), 0 2px 6px rgba(28, 29, 31, 0.03);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; color: var(--ink); }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(55% 45% at 8% 0%, rgba(124, 108, 255, 0.10), transparent 70%),
        radial-gradient(45% 40% at 96% 6%, rgba(60, 224, 255, 0.10), transparent 70%),
        radial-gradient(55% 45% at 75% 100%, rgba(255, 94, 168, 0.07), transparent 70%);
    }
    body {
      font-family: var(--font); min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }

    @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ---------- header ---------- */
    .site-header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      max-width: 1280px; margin: 0 auto; height: 64px; padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand-mark { width: 34px; height: 34px; flex-shrink: 0; display: block; }
    .brand-name { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
    .brand-divider { width: 1px; height: 18px; background: var(--line); }
    .brand-product { font-size: 14px; color: var(--ink-3); }

    .status-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 14px 7px 12px; border-radius: 99px;
      background: var(--surface); border: 1px solid var(--line);
      font-size: 13px; font-weight: 500; color: var(--ink-2);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .status-pill .sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); position: relative; }
    .status-pill[data-state="connecting"] .sdot { background: var(--amber); }
    .status-pill[data-state="live"] { color: var(--ink); border-color: var(--live-100); background: var(--live-50); }
    .status-pill[data-state="live"] .sdot::after {
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      background: var(--live); opacity: 0.35; animation: ping 1.6s ease-out infinite;
    }
    .status-pill[data-state="ended"] .sdot { background: var(--ink-3); }
    @keyframes ping { from { transform: scale(0.6); opacity: 0.5; } to { transform: scale(1.8); opacity: 0; } }

    /* ---------- console shell ---------- */
    .page { max-width: 1280px; margin: 0 auto; padding: 24px 28px 32px; }
    .console {
      display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      height: max(620px, min(880px, calc(100vh - 64px - 56px)));
      background: rgba(255, 255, 255, 0.82); border: 1px solid var(--line); border-radius: 28px;
      overflow: hidden; box-shadow: var(--shadow-md);
      animation: riseIn 0.6s var(--ease-smooth) both;
    }

    /* ---------- left: agent ---------- */
    .agent-panel {
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      padding: 52px 32px 36px; text-align: center;
      background:
        radial-gradient(closest-side at 50% 58%, rgba(124, 108, 255, 0.11), rgba(60, 224, 255, 0.05) 62%, transparent 100%),
        linear-gradient(180deg, #ffffff, #fcfcff);
      border-right: 1px solid var(--line);
    }
    .agent-panel::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(var(--dot) 1.1px, transparent 1.4px);
      background-size: 20px 20px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 55%, #000 25%, transparent 72%);
      mask-image: radial-gradient(ellipse at 50% 55%, #000 25%, transparent 72%);
    }
    .agent-panel > * { position: relative; }
    .agent-hello { margin: 0; font-size: clamp(26px, 2.6vw, 34px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; }
    .agent-hello .wave { display: inline-block; transform-origin: 70% 75%; animation: wave 2.4s ease-in-out 0.8s 2; }
    @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(-4deg); } 50% { transform: rotate(10deg); } }
    .agent-sub { margin-top: 8px; font-size: 15px; color: var(--ink-2); }

    .caller-chip {
      margin-top: 18px; display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px 6px 8px; border-radius: 99px;
      background: var(--surface); border: 1px solid var(--line);
      font-size: 12.5px; color: var(--ink-2); box-shadow: var(--shadow-sm);
    }
    .caller-chip svg { width: 16px; height: 16px; flex-shrink: 0; }
    .caller-chip .num { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); }
    .caller-chip .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); opacity: 0.6; }

    .orb-stage { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 300px; }
    .orb-wrap {
      position: relative; width: min(340px, 100%); aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .orb-wrap::after {
      /* soft contact shadow so the sphere floats */
      content: ""; position: absolute; left: 20%; right: 20%; bottom: -10%; height: 10%;
      border-radius: 50%; pointer-events: none;
      background: radial-gradient(closest-side, rgba(37, 7, 133, 0.2), transparent);
      filter: blur(8px);
      animation: shadowBreathe 7s ease-in-out infinite;
    }
    @keyframes shadowBreathe { 50% { transform: scale(0.92); opacity: 0.75; } }
    .orb-halo {
      position: absolute; inset: -14%; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(124, 108, 255, 0.16) 0%, rgba(60, 224, 255, 0.12) 40%, rgba(255, 94, 168, 0.08) 56%, transparent 70%);
      filter: blur(22px);
      opacity: calc(0.7 + var(--level, 0) * 0.8);
      transform: scale(calc(1 + var(--level, 0) * 0.12));
      transition: opacity 0.12s linear, transform 0.12s linear;
    }
    .orb {
      position: absolute; inset: 0; border-radius: 50%; overflow: hidden; isolation: isolate;
      background: radial-gradient(circle at 34% 28%, #ffffff 0%, #f6f4ff 22%, #e9e6fc 48%, #dadcf7 72%, #cdd1f2 100%);
      box-shadow:
        inset -20px -28px 60px rgba(37, 7, 133, 0.14),
        inset 14px 18px 40px rgba(255, 255, 255, 0.9),
        0 30px 60px -36px rgba(37, 7, 133, 0.3);
      animation: breathe 7s ease-in-out infinite;
    }
    .orb canvas {
      display: block; width: 100%; height: 100%; border-radius: 50%;
      /* feather the shader's rim so there's no hard cut-out edge */
      -webkit-mask-image: radial-gradient(closest-side, #000 80%, transparent 100%);
      mask-image: radial-gradient(closest-side, #000 80%, transparent 100%);
      transition: filter 0.8s ease;
    }
    .orb::after {
      /* specular highlight + light rim: reads as glass and melts the edge into the white page */
      content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      background:
        radial-gradient(circle at 31% 23%, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0) 24%),
        radial-gradient(circle at 50% 50%, transparent 64%, rgba(255, 255, 255, 0.28) 88%, rgba(255, 255, 255, 0.55) 100%);
    }
    @keyframes breathe { 50% { translate: 0 -6px; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* halo tint per call state: pink-peach while the customer talks, like their bubbles */
    .console[data-state="listening"] .orb-halo { background: radial-gradient(circle, rgba(255, 94, 168, 0.2) 0%, rgba(255, 170, 130, 0.14) 40%, transparent 68%); }
    .console[data-state="connecting"] .orb-halo { animation: breatheHalo 1.4s ease-in-out infinite; }
    @keyframes breatheHalo { 0%, 100% { opacity: 0.4; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.06); } }
    .console[data-state="ended"] .orb canvas { filter: grayscale(0.8); }

    /* ---------- the one call button: Start Speaking ↔ Hang Up ---------- */
    .call-btn {
      margin-top: 20px;
      display: inline-flex; align-items: center; gap: 10px;
      padding: 15px 30px; border-radius: 99px; cursor: pointer;
      font-size: 16px; font-weight: 500; letter-spacing: -0.01em;
      color: #fff; background: linear-gradient(180deg, #2c2c35, #15161a);
      border: 1px solid #15161a;
      box-shadow: 0 14px 28px -14px rgba(21, 22, 26, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: transform 0.25s var(--ease-out-quint), background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .call-btn:hover { transform: translateY(-1px); box-shadow: 0 18px 32px -14px rgba(21, 22, 26, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.14); }
    .call-btn:active { transform: scale(0.97); }
    .call-btn:focus-visible { outline: 3px solid var(--accent-600); outline-offset: 3px; }
    .call-btn svg { width: 19px; height: 19px; flex-shrink: 0; }
    .call-btn .ic-hang, .call-btn .ic-spin { display: none; }
    .call-btn[data-mode="hangup"] {
      color: #fff; background: var(--coral); border-color: var(--coral);
      box-shadow: 0 14px 28px -14px rgba(201, 75, 65, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    .call-btn[data-mode="hangup"]:hover { background: var(--coral-700); }
    .call-btn[data-mode="hangup"] .ic-mic { display: none; }
    .call-btn[data-mode="hangup"] .ic-hang { display: block; }
    .call-btn[data-mode="connecting"] { cursor: progress; color: var(--ink-2); background: var(--surface-2); border-color: var(--line); box-shadow: none; }
    .call-btn[data-mode="connecting"] .ic-mic { display: none; }
    .call-btn[data-mode="connecting"] .ic-spin { display: block; animation: spin 0.9s linear infinite; }
    .call-btn[data-mode="connecting"]:hover { transform: none; }

    .orb-caption { min-height: 58px; justify-content: flex-end; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .cap-time {
      font-size: 30px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .cap-time[hidden] { display: none; }
    .cap-status { font-size: 14px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 7px; }
    .cap-status .bars { display: none; align-items: center; gap: 2px; height: 12px; }
    .cap-status .bars i { width: 2.5px; height: 100%; border-radius: 2px; background: currentColor; animation: bar 0.9s ease-in-out infinite; }
    .cap-status .bars i:nth-child(2) { animation-delay: 0.15s; }
    .cap-status .bars i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bar { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
    .console[data-state="listening"] .cap-status { color: var(--peach-ink); }
    .console[data-state="bot-speaking"] .cap-status { color: var(--accent-700); }
    .console[data-state="listening"] .cap-status .bars,
    .console[data-state="bot-speaking"] .cap-status .bars { display: inline-flex; }

    /* ---------- right: transcript / analysis ---------- */
    .transcript-panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
    .tp-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 26px 32px 18px; border-bottom: 1px solid var(--line-soft);
    }
    .tp-title { display: flex; align-items: center; gap: 10px; }
    .tp-title h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); position: relative; flex-shrink: 0; transition: background 0.3s ease; }
    .transcript-panel[data-live="true"] .live-dot { background: var(--live); }
    .transcript-panel[data-live="true"] .live-dot::after {
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      background: var(--live); animation: ping 1.6s ease-out infinite;
    }
    .tp-sub { font-size: 13px; color: var(--ink-3); margin-top: 3px; padding-left: 18px; }

    .tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
    .tabs[hidden] { display: none; }
    .tabs button {
      border: none; background: transparent; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--ink-2);
      padding: 6px 15px; border-radius: 99px;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }
    .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(28, 29, 31, 0.1); }
    .tabs button:focus-visible, .an-quote:focus-visible { outline: 2px solid var(--accent-600); outline-offset: 2px; }

    .tp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 32px 28px; scroll-behavior: smooth; }

    /* ---------- bubbles ---------- */
    #feed { display: flex; flex-direction: column; gap: 18px; }
    #feed[hidden] { display: none; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
    .msg { display: flex; flex-direction: column; max-width: min(78%, 560px); border-radius: 0; }
    .msg.bot { align-self: flex-start; align-items: flex-start; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg:last-child { animation: msgIn 0.35s var(--ease-smooth); }
    .bubble {
      padding: 15px 22px; font-size: 16.5px; line-height: 1.5; letter-spacing: -0.01em;
      border: 1px solid; border-radius: 24px;
      box-shadow: inset 0 -2px 0 rgba(28, 29, 31, 0.03);
      overflow-wrap: anywhere;
    }
    .msg.bot .bubble { background: linear-gradient(180deg, var(--lav-bg), var(--lav-bg-2)); border-color: var(--lav-line); border-bottom-left-radius: 8px; }
    .msg.user .bubble { background: linear-gradient(180deg, var(--peach-bg), var(--peach-bg-2)); border-color: var(--peach-line); border-bottom-right-radius: 8px; }
    .meta { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--ink-3); margin: 0 8px 6px; }
    .meta b { font-weight: 600; color: var(--ink-2); }
    .meta .t { font-variant-numeric: tabular-nums; }
    .msg.pending .bubble .text:not(:empty)::after {
      content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 3px;
      vertical-align: -2px; background: currentColor; opacity: 0.6; animation: caret 1s steps(2) infinite;
    }
    @keyframes caret { 50% { opacity: 0; } }
    .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: typing 1.2s ease-in-out infinite; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
    .msg.highlight .bubble { box-shadow: 0 0 0 3px var(--accent-300); transition: box-shadow 0.4s ease; }

    /* ---------- empty state ---------- */
    .empty-state { height: 100%; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .empty-art { position: relative; width: 168px; height: 104px; margin-bottom: 22px; }
    .empty-art span { position: absolute; height: 30px; border-radius: 15px; border: 1px solid; animation: riseIn 0.6s var(--ease-smooth) both; }
    .empty-art .e1 { left: 0; top: 0; width: 120px; background: var(--lav-bg); border-color: var(--lav-line); border-bottom-left-radius: 6px; }
    .empty-art .e2 { right: 0; top: 36px; width: 90px; background: var(--peach-bg); border-color: var(--peach-line); border-bottom-right-radius: 6px; animation-delay: 0.12s; }
    .empty-art .e3 { left: 0; top: 72px; width: 72px; background: var(--lav-bg); border-color: var(--lav-line); border-bottom-left-radius: 6px; animation-delay: 0.24s; }
    .empty-title { font-size: 16px; font-weight: 600; letter-spacing: -0.015em; }
    .empty-sub { font-size: 14px; color: var(--ink-3); margin-top: 6px; max-width: 300px; line-height: 1.5; }

    /* ---------- call analysis ---------- */
    #analysis { display: flex; flex-direction: column; gap: 14px; animation: msgIn 0.4s var(--ease-smooth); }
    #analysis[hidden] { display: none; }
    .an-k { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

    .an-hero { border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; background: var(--surface-3); }
    .an-hero-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .an-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); flex-shrink: 0; align-self: center; box-shadow: 0 0 0 4px var(--line-soft); }
    .an-hero-title { font-size: 22px; font-weight: 600; letter-spacing: -0.025em; }
    .an-hero-detail { font-size: 14.5px; color: var(--ink-2); }
    .an-hero.tone-ok .an-dot { background: var(--live); box-shadow: 0 0 0 4px var(--live-100); }
    .an-hero.tone-info .an-dot { background: var(--lav-ink); box-shadow: 0 0 0 4px var(--lav-bg); }
    .an-hero.tone-warn .an-dot { background: var(--amber); box-shadow: 0 0 0 4px var(--amber-50); }
    .an-hero.tone-bad .an-dot { background: var(--red); box-shadow: 0 0 0 4px var(--red-50); }
    .an-meta { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }

    .an-follow {
      display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
      margin-top: 16px; padding: 13px 15px; border-radius: 14px;
      background: var(--lav-bg); border: 1px solid var(--lav-line);
    }
    .an-follow.none { background: var(--surface-2); border-color: var(--line-soft); }
    .an-follow-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--surface); color: var(--lav-ink); display: flex; align-items: center; justify-content: center; }
    .an-follow.none .an-follow-icon { color: var(--ink-3); }
    .an-follow-icon svg { width: 18px; height: 18px; }
    .an-follow-title { font-size: 14px; font-weight: 600; }
    .an-follow-sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
    @media (max-width: 560px) { .an-follow { grid-template-columns: auto 1fr; } .an-follow .chip { grid-column: 2; justify-self: start; } }

    .chip {
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      font-size: 11.5px; font-weight: 500; padding: 3px 10px; border-radius: 99px;
      background: var(--surface); color: var(--ink-2); border: 1px solid var(--line);
    }
    .chip.warn { background: var(--amber-50); color: var(--amber); border-color: var(--amber-line); }
    .chip.bad { background: var(--red-50); color: var(--red); border-color: var(--red-line); }

    .an-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 1000px) { .an-grid { grid-template-columns: 1fr; } }
    .an-card { border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; background: var(--surface); }

    .an-sent-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .sent-pill { font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
    .sent-pill.frustrated { background: var(--red-50); color: var(--red); }
    .sent-pill.positive { background: var(--live-50); color: var(--ok-700); }
    .an-traj { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
    .an-traj b { font-weight: 600; color: var(--ink); }
    .an-traj .arrow { color: var(--ink-3); }
    .an-rationale { font-size: 13.5px; color: var(--ink-2); margin-top: 10px; line-height: 1.5; }
    .an-quotes { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .an-quote {
      text-align: left; cursor: pointer;
      border: 1px solid var(--peach-line); background: var(--peach-bg); color: var(--ink);
      padding: 9px 13px; border-radius: 14px 14px 4px 14px; font-size: 13.5px; line-height: 1.45;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .an-quote:hover { transform: translateX(-2px); border-color: var(--peach-ink); }
    .an-quote .turn { display: block; font-size: 11px; color: var(--ink-3); margin-top: 3px; }

    .an-dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 12px 0 0; font-size: 13.5px; }
    .an-dl dt { color: var(--ink-3); }
    .an-dl dd { margin: 0; font-weight: 500; }
    .an-dl dd .sub { display: block; font-weight: 400; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
    .an-flags { display: flex; flex-wrap: wrap; gap: 6px; }
    .an-none { color: var(--ink-3); font-weight: 400; }

    .an-summary { font-size: 14.5px; line-height: 1.6; margin-top: 10px; }
    .an-foot { font-size: 12px; color: var(--ink-3); line-height: 1.55; padding: 0 4px; }
    .an-foot a { color: var(--accent-700); }
    .an-note { font-size: 13px; color: var(--ink-2); padding: 12px 14px; border: 1px dashed var(--line); border-radius: 14px; }
    .an-note code { font-family: var(--font-mono); font-size: 12px; }

    @keyframes shimmer { 0% { background-position: -300px 0; } 100% { background-position: 300px 0; } }
    .skel { border-radius: 6px; background: linear-gradient(90deg, var(--surface-2) 0, var(--line-soft) 50%, var(--surface-2) 100%); background-size: 600px 100%; animation: shimmer 1.3s linear infinite; }
    .skel.line { height: 12px; margin-top: 10px; }
    .skel.pill { height: 26px; width: 110px; margin-top: 10px; border-radius: 99px; }

    .error-banner {
      margin: 0 32px 20px; padding: 11px 14px;
      border: 1px solid var(--red-line); background: var(--red-50); color: var(--red);
      border-radius: 14px; font-size: 13px; display: none;
    }
    .error-banner.show { display: block; }

    .tp-body::-webkit-scrollbar { width: 10px; }
    .tp-body::-webkit-scrollbar-track { background: transparent; }
    .tp-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; border: 3px solid var(--surface); }

    /* ---------- responsive ---------- */
    @media (max-width: 860px) {
      .page { padding: 16px; }
      .header-inner { padding: 0 16px; }
      .brand-divider, .brand-product { display: none; }
      .console { grid-template-columns: 1fr; height: auto; border-radius: 24px; }
      .agent-panel { border-right: none; border-bottom: 1px solid var(--line); padding: 36px 20px 28px; }
      .orb-stage { min-height: 0; padding: 28px 0 20px; }
      .orb-wrap { width: min(280px, 100%); }
      .tp-head { padding: 20px 20px 14px; }
      .tp-body { padding: 20px; max-height: 70vh; min-height: 360px; }
      .error-banner { margin: 0 20px 16px; }
      .msg { max-width: 88%; }
      .bubble { font-size: 15.5px; padding: 13px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
      .orb, .orb-halo { transition: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Mumbai Bank home">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="bankGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#7c6cff" />
              <stop offset="1" stop-color="#250785" />
            </linearGradient>
          </defs>
          <rect width="48" height="48" rx="14" fill="url(#bankGrad)" />
          <g transform="translate(9,12)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M0 6 15 0 30 6" />
            <line x1="1.5" y1="6" x2="28.5" y2="6" />
            <line x1="5" y1="10" x2="5" y2="18" />
            <line x1="11.5" y1="10" x2="11.5" y2="18" />
            <line x1="18.5" y1="10" x2="18.5" y2="18" />
            <line x1="25" y1="10" x2="25" y2="18" />
            <line x1="0" y1="22" x2="30" y2="22" />
          </g>
        </svg>
        <span class="brand-name">Mumbai Bank</span>
        <span class="brand-divider"></span>
        <span class="brand-product">Credit Card Assistant</span>
      </a>
      <div class="status-pill" id="statusPill" data-state="idle" role="status" aria-live="polite">
        <span class="sdot"></span><span id="statusText">Ready</span>
      </div>
    </div>
  </header>

  <div class="page">
    <main class="console" id="console" data-state="idle">
      <section class="agent-panel" aria-label="Call with Shreya">
        <h1 class="agent-hello">Hi, I am Shreya <span class="wave" aria-hidden="true">👋</span></h1>
        <div class="agent-sub">Your Mumbai Bank credit card assistant</div>
        <div class="caller-chip">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#23a7a3"/><path d="M4.6 8.2 7 10.5 11.4 5.7" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Verified caller
          <span class="sep"></span>
          <span class="num">+91 22 6107 8000</span>
        </div>

        <div class="orb-stage">
          <div class="orb-wrap" id="orbWrap">
            <div class="orb-halo"></div>
            <div class="orb" aria-hidden="true"><canvas id="orbCanvas"></canvas></div>
          </div>
        </div>

        <div class="orb-caption" aria-live="polite">
          <div class="cap-time" id="capTime" hidden>00:00</div>
          <div class="cap-status"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="capStatus">Shreya will greet you as soon as you connect</span></div>
        </div>
        <button class="call-btn" id="callBtn" type="button" data-mode="start">
          <svg class="ic-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <svg class="ic-hang" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-3.1 0-6.1.7-8.6 2.1-.8.4-1.2 1.3-1 2.2l.5 2c.2.8 1 1.3 1.8 1.2l3-.5c.8-.1 1.4-.8 1.4-1.6v-1.6c1.9-.5 3.9-.5 5.8 0v1.6c0 .8.6 1.5 1.4 1.6l3 .5c.8.1 1.6-.4 1.8-1.2l.5-2c.2-.9-.2-1.8-1-2.2C18.1 9.7 15.1 9 12 9z"/></svg>
          <svg class="ic-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" /></svg>
          <span id="callBtnLabel">Start Speaking</span>
        </button>
      </section>

      <section class="transcript-panel" id="transcriptPanel" data-live="false">
        <div class="tp-head">
          <div>
            <div class="tp-title"><span class="live-dot"></span><h2 id="panelTitle">Live Transcript</h2></div>
            <div class="tp-sub" id="panelSub">Appears here as you talk</div>
          </div>
          <div class="tabs" id="tabs" role="tablist" hidden>
            <button type="button" role="tab" id="tabAnalysis" aria-selected="true">Analysis</button>
            <button type="button" role="tab" id="tabTranscript" aria-selected="false">Transcript</button>
          </div>
        </div>
        <div class="tp-body" id="tpBody">
          <div id="analysis" role="tabpanel" aria-labelledby="tabAnalysis" hidden></div>
          <div id="feed" aria-live="polite"></div>
        </div>
        <div class="error-banner" id="errorBanner" role="alert"></div>
      </section>
    </main>
  </div>

  <script type="module">
    import { PipecatClient } from "https://cdn.jsdelivr.net/npm/@pipecat-ai/client-js@1.15.0/+esm";
    import { SmallWebRTCTransport } from "https://cdn.jsdelivr.net/npm/@pipecat-ai/small-webrtc-transport@1.11.1/+esm";

    const el = (id) => document.getElementById(id);
    const consoleEl = el("console");
    const callBtn = el("callBtn");
    const callBtnLabel = el("callBtnLabel");
    const capTime = el("capTime");
    const capStatus = el("capStatus");
    const statusPill = el("statusPill");
    const statusText = el("statusText");
    const transcriptPanel = el("transcriptPanel");
    const panelTitle = el("panelTitle");
    const panelSub = el("panelSub");
    const tabsEl = el("tabs");
    const tabAnalysis = el("tabAnalysis");
    const tabTranscript = el("tabTranscript");
    const analysisEl = el("analysis");
    const tpBody = el("tpBody");
    const feedEl = el("feed");
    const errorBanner = el("errorBanner");

    const AGENT_NAME = "Shreya";
    const IN_CALL = new Set(["connected-idle", "listening", "bot-speaking"]);
    const STATE_COPY = {
      idle: { cap: `${AGENT_NAME} will greet you as soon as you connect`, pill: "Ready" },
      connecting: { cap: "Connecting you to Shreya…", pill: "Connecting" },
      "connected-idle": { cap: "Connected", pill: "On call" },
      listening: { cap: "Listening…", pill: "On call" },
      "bot-speaking": { cap: `${AGENT_NAME} is speaking`, pill: "On call" },
      ended: { cap: "Call ended · start again anytime", pill: "Call ended" },
    };

    function setCallScreenState(state) {
      if (consoleEl.dataset.state === state) return;
      consoleEl.dataset.state = state;
      const inCall = IN_CALL.has(state);

      callBtn.dataset.mode = inCall ? "hangup" : state === "connecting" ? "connecting" : "start";
      callBtnLabel.textContent = inCall ? "Hang Up" : state === "connecting" ? "Connecting…" : "Start Speaking";
      callBtn.setAttribute("aria-label", inCall ? "Hang up the call" : "Start speaking with Shreya");

      capTime.hidden = !(inCall || state === "ended");
      capStatus.textContent = STATE_COPY[state].cap;
      statusPill.dataset.state = inCall ? "live" : state;
      if (!inCall) statusText.textContent = STATE_COPY[state].pill;
      transcriptPanel.dataset.live = String(inCall);
    }

    // Only used when the server never returns an analysis (older bot.main
    // build, or the call never reached the server).
    const OUTCOME_LABELS = {
      promise_to_pay: "Promise to pay",
      already_paid: "Already paid",
      callback_request: "Callback requested",
      dispute_transfer: "Dispute — transferred",
      no_outcome: "No outcome",
    };

    function fmtTime(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const m = String(Math.floor(total / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      return `${m}:${s}`;
    }
    function newId() {
      return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
    }
    function fmtDate(iso, opts = { weekday: "short", day: "numeric", month: "short" }) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString(undefined, opts);
    }
    function relativeDay(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const days = Math.round((new Date(y, m - 1, d) - today) / 86400000);
      if (days === 0) return "today";
      if (days === 1) return "tomorrow";
      if (days === -1) return "yesterday";
      return days > 0 ? `in ${days} days` : `${-days} days ago`;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // --- call record ---
    let currentCall = null; // the call in progress (or just-ended, before being superseded by a new one)
    let pendingUser = null;
    let pendingBot = null;
    let callStartedAt = null;
    let timerInterval = null;
    let liveOutcome = null;
    let liveCallId = null;
    let connected = false;
    let activeTab = "analysis"; // after a call ends: "analysis" | "transcript"

    function elapsed() { return callStartedAt ? Date.now() - callStartedAt : 0; }

    function startTimer() {
      callStartedAt = Date.now();
      capTime.textContent = "00:00";
      statusText.textContent = "On call · 00:00";
      timerInterval = setInterval(() => {
        const t = fmtTime(elapsed());
        capTime.textContent = t;
        statusText.textContent = `On call · ${t}`;
      }, 250);
    }
    function stopTimer() { clearInterval(timerInterval); timerInterval = null; }

    // --- transcript rendering ---
    function messageHtml(m) {
      const who = m.role === "user" ? "You" : AGENT_NAME;
      const body = m.pending && !m.text
        ? `<span class="typing" aria-label="${who} is speaking"><i></i><i></i><i></i></span>`
        : `<span class="text">${escapeHtml(m.text || "")}</span>`;
      return `<div class="msg ${m.role}${m.pending ? " pending" : ""}" data-idx="${m.idx ?? ""}">
        <div class="meta"><b>${who}</b>${m.t != null ? `<span class="t">${fmtTime(m.t)}</span>` : ""}</div>
        <div class="bubble">${body}</div>
      </div>`;
    }
    const EMPTY_STATE_HTML = `
      <div class="empty-state">
        <div class="empty-art" aria-hidden="true"><span class="e1"></span><span class="e2"></span><span class="e3"></span></div>
        <div class="empty-title">Your conversation will appear here</div>
        <div class="empty-sub">Press Start Speaking and the transcript fills in as you and Shreya talk.</div>
      </div>`;

    function renderTranscript() {
      // A late transport event after hangup must not draw the feed over the analysis tab.
      if (currentCall?.endedAt && activeTab === "analysis") return;
      const messages = currentCall ? currentCall.transcript.map((m, idx) => ({ ...m, idx })) : [];
      feedEl.innerHTML = messages.length === 0 ? EMPTY_STATE_HTML : messages.map(messageHtml).join("");
      feedEl.style.height = messages.length === 0 ? "100%" : "";
      feedEl.hidden = false;
      tpBody.scrollTop = tpBody.scrollHeight;
    }

    const CALENDAR_ICON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4.5" width="14" height="12.5" rx="2.5"/><path d="M3 8.5h14M7 2.5v3.5M13 2.5v3.5"/></svg>';
    const NO_CALL_ICON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M5.5 14.5l9-9"/></svg>';
    const SENTIMENT_LABELS = { frustrated: "Frustrated", neutral: "Neutral", positive: "Positive", unclear: "Unclear" };
    const DATE_SOURCE_LABELS = {
      customer: "Customer's words",
      promise_date: "Day after promised date",
      verification_window: "Payment posting window",
      retry_policy: "Retry policy",
      default_sla: "Default SLA · no date given",
    };
    const OUTCOME_TONE = { promise_to_pay: "ok", already_paid: "ok", callback_request: "info", dispute_transfer: "warn", no_outcome: "bad" };
    const FLAG_TONE = { abuse_detected: "bad", legal_threat: "bad", guardrail_triggered: "bad", hardship_disclosed: "warn" };

    function prettyDates(text) {
      return escapeHtml(text || "").replace(/\b(\d{4}-\d{2}-\d{2})\b/g, (iso) => fmtDate(iso, { day: "numeric", month: "short" }));
    }

    function renderPanel() {
      const call = currentCall;
      const ended = !!call && !!call.endedAt;
      const showAnalysis = ended && activeTab === "analysis";

      tabsEl.hidden = !ended;
      panelTitle.textContent = showAnalysis ? "Call Analysis" : ended ? "Transcript" : "Live Transcript";
      panelSub.textContent = !call
        ? "Appears here as you talk"
        : !ended
          ? "Updating as you talk · analysis follows when the call ends"
          : `${fmtTime(call.durationMs ?? 0)} call with ${AGENT_NAME}`;
      tabAnalysis.setAttribute("aria-selected", String(showAnalysis));
      tabTranscript.setAttribute("aria-selected", String(ended && !showAnalysis));
      analysisEl.hidden = !showAnalysis;

      if (showAnalysis) {
        feedEl.hidden = true;
        renderAnalysis();
        tpBody.scrollTop = 0;
      } else {
        renderTranscript();
      }
    }

    function skeletonCard(title) {
      return `<section class="an-card"><div class="an-k">${title}</div><div class="skel pill"></div><div class="skel line" style="width:92%"></div><div class="skel line" style="width:70%"></div></section>`;
    }

    function renderAnalysis() {
      const call = currentCall;
      const a = call.analysis;
      const customerTurns = call.transcript.filter((m) => m.role === "user").length;
      const meta = `${fmtTime(call.durationMs ?? 0)} call · ${customerTurns} customer turn${customerTurns === 1 ? "" : "s"}`;

      if (!a || !a.workflow) {
        if (!call.analysisGaveUp) {
          analysisEl.innerHTML = `
            <section class="an-hero"><div class="an-k">Outcome</div><div class="skel line" style="width:45%;height:22px"></div><div class="skel line" style="width:30%"></div></section>
            <div class="an-grid">${skeletonCard("Customer sentiment")}${skeletonCard("Workflow")}</div>`;
          return;
        }
        // Server never answered: show what the client itself knows, and say so.
        const o = call.outcome ?? { type: "no_outcome" };
        analysisEl.innerHTML = `
          <section class="an-hero tone-${OUTCOME_TONE[o.type] ?? "bad"}">
            <div class="an-k">Outcome</div>
            <div class="an-hero-row"><span class="an-dot"></span><span class="an-hero-title">${OUTCOME_LABELS[o.type] ?? escapeHtml(o.type)}</span></div>
            <div class="an-meta">${meta}</div>
          </section>
          <div class="an-note">Analysis unavailable — the server didn't return one for this call. Restart <code>bot.main</code> if it predates the post-call analysis.</div>`;
        return;
      }

      const wf = a.workflow;
      const fu = wf.follow_up;
      const followHtml = fu.needed
        ? `<div class="an-follow">
             <div class="an-follow-icon">${CALENDAR_ICON}</div>
             <div><div class="an-follow-title">Follow-up ${fu.date ? `· ${fmtDate(fu.date)} <span class="an-none">(${relativeDay(fu.date)})</span>` : ""}</div><div class="an-follow-sub">${escapeHtml(fu.reason)}</div></div>
             <span class="chip ${fu.date_source === "default_sla" ? "warn" : ""}">${DATE_SOURCE_LABELS[fu.date_source] ?? ""}</span>
           </div>`
        : `<div class="an-follow none">
             <div class="an-follow-icon">${NO_CALL_ICON}</div>
             <div><div class="an-follow-title">No follow-up call</div><div class="an-follow-sub">${escapeHtml(fu.reason)}</div></div>
           </div>`;

      const flagsHtml = wf.flags.length
        ? `<div class="an-flags">${wf.flags.map((f) => `<span class="chip ${FLAG_TONE[f.key] ?? ""}">${escapeHtml(f.label)}</span>`).join("")}</div>`
        : `<span class="an-none">None</span>`;

      let sentimentHtml;
      const sent = a.sentiment;
      if (a.status === "pending") {
        sentimentHtml = `<div class="skel pill"></div><div class="skel line" style="width:92%"></div><div class="skel line" style="width:70%"></div>`;
      } else if (!sent) {
        sentimentHtml = `<div class="an-rationale">Sentiment analysis failed for this call. Outcome, follow-up and stage above are unaffected.</div>`;
      } else {
        const traj = sent.start !== sent.end
          ? `<span class="an-traj"><b>${SENTIMENT_LABELS[sent.start]}</b><span class="arrow">→</span><b>${SENTIMENT_LABELS[sent.end]}</b></span>`
          : `<span class="an-traj">Steady through the call</span>`;
        const quotes = sent.evidence.map((e) =>
          `<button type="button" class="an-quote" data-quote="${escapeHtml(e.quote)}">“${escapeHtml(e.quote)}”<span class="turn">Turn ${e.turn + 1} · show in transcript</span></button>`
        ).join("");
        sentimentHtml = `
          <div class="an-sent-row"><span class="sent-pill ${sent.overall}">${SENTIMENT_LABELS[sent.overall]}</span>${traj}</div>
          <div class="an-rationale">${escapeHtml(sent.rationale)}</div>
          ${quotes ? `<div class="an-quotes">${quotes}</div>` : ""}`;
      }

      const summaryHtml = a.status === "pending"
        ? `<div class="skel line" style="width:96%"></div><div class="skel line" style="width:88%"></div>`
        : sent ? `<div class="an-summary">${escapeHtml(sent.summary)}</div>` : `<div class="an-rationale">Unavailable.</div>`;

      analysisEl.innerHTML = `
        <section class="an-hero tone-${OUTCOME_TONE[wf.outcome.type] ?? "bad"}">
          <div class="an-k">Outcome</div>
          <div class="an-hero-row"><span class="an-dot"></span><span class="an-hero-title">${escapeHtml(wf.outcome.label)}</span><span class="an-hero-detail">${prettyDates(wf.outcome.detail)}</span></div>
          <div class="an-meta">${meta}</div>
          ${followHtml}
        </section>
        <div class="an-grid">
          <section class="an-card"><div class="an-k">Customer sentiment</div>${sentimentHtml}</section>
          <section class="an-card">
            <div class="an-k">Workflow</div>
            <dl class="an-dl">
              <dt>Stage</dt><dd>${escapeHtml(wf.stage.label)}${wf.stage.overridden_from ? `<span class="sub">Outcome alone would have been: ${escapeHtml(wf.stage.overridden_from)}</span>` : ""}</dd>
              <dt>Routed to</dt><dd>${escapeHtml(wf.stage.team)}</dd>
              <dt>Flags</dt><dd>${flagsHtml}</dd>
            </dl>
          </section>
        </div>
        <section class="an-card"><div class="an-k">Summary</div>${summaryHtml}</section>
        <div class="an-foot">Sentiment and summary by ${escapeHtml(sent?.model ?? "gpt-4o")}, with quotes checked against the transcript. Outcome, follow-up and stage come from fixed rules on the recorded outcome, not the model.${call.callId ? ` · <a href="?call=${encodeURIComponent(call.callId)}">Link to this call</a>` : ""}</div>`;
    }

    function normQuote(t) { return t.toLowerCase().replace(/[^\w\s']/g, " ").replace(/\s+/g, " ").trim(); }

    analysisEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".an-quote");
      if (!btn) return;
      const q = normQuote(btn.dataset.quote);

        body.lastT = tNow;
        const target = cfg.audio;
        body.audioSmooth += (target - body.audioSmooth) * ease(dt, target > body.audioSmooth ? 0.11 : 0.3);
        body.audioFast += (target - body.audioFast) * ease(dt, target > body.audioFast ? 0.04 : 0.18);
        const o = (6.31 * cfg.phase) % 1;
        const s = 0.35 * Math.sin(tNow * (0.11 + 0.08 * ((2.17 * cfg.phase) % 1)) + cfg.phase);
        const a = body.audioFast;
        const d = Math.sin(tNow * (0.45 + 0.2 * o) + cfg.phase);
        if (Math.sign(d) !== body.oscSign) { body.oscSign = Math.sign(d); body.flipQueued = true; }
        if (body.flipQueued && a < 0.18) { body.spinDir = -body.spinDir; body.flipQueued = false; }
        const targetVel = (0.65 * (0.65 + 0.7 * o) * (1 + s) + body.spinDir * a * 2.2) * cfg.spin;
        body.spinVel += (targetVel - body.spinVel) * ease(dt, 0.35);
        const burst = Math.max(0, a - body.prevA);
        body.prevA = a;
        body.spinVel += body.spinDir * Math.min(6 * burst, 1.4) * dt * 14;
        body.spin += body.spinVel * dt;
      };

      const start = performance.now();
      (function tick() {
        requestAnimationFrame(tick);
        if (!ready || !prog) return;
        const tNow = ((performance.now() - start) / 1000) * cfg.speed;
        advance(tNow);
        gl.useProgram(prog);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(u.uRes, canvas.width, canvas.height);
        gl.uniform3f(u.uBg, ...cfg.bg);
        gl.uniform3f(u.uAnchor, ...cfg.anchor);
        gl.uniform3f(u.uC0, ...cfg.c0);
        gl.uniform3f(u.uC1, ...cfg.c1);
        gl.uniform3f(u.uC2, ...cfg.c2);
        gl.uniform1f(u.uTime, tNow);
        gl.uniform1f(u.uPhase, cfg.phase);
        gl.uniform1f(u.uArch, cfg.arch);
        gl.uniform1f(u.uLens, cfg.lens);
        gl.uniform1f(u.uAudio, body.audioSmooth);
        gl.uniform1f(u.uSpin, body.spin);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      })();

      return { setAudio(level) { cfg.audio = level; } };
    }
    const orb = createOrb(el("orbCanvas"));

    let localMeter = null;
    let remoteMeter = null;
    let activeChannel = null; // "local" | "remote" | null

    (function levelLoop() {
      let level = 0;
      if (activeChannel === "local" && localMeter) level = localMeter.level();
      else if (activeChannel === "remote" && remoteMeter) level = remoteMeter.level();
      consoleEl.style.setProperty("--level", level.toFixed(3));
      orb?.setAudio(level);
      requestAnimationFrame(levelLoop);
    })();

    let audioEl = document.querySelector("audio#botAudio");
    if (!audioEl) {
      audioEl = document.createElement("audio");
      audioEl.id = "botAudio";
      audioEl.autoplay = true;
      audioEl.style.display = "none";
      document.body.appendChild(audioEl);
    }

    const client = new PipecatClient({
      transport: new SmallWebRTCTransport(),
      enableMic: true,
      enableCam: false,
      callbacks: {
        onConnected: () => {
          connected = true;
          clearError();
          setCallScreenState("connected-idle");
          startTimer();
        },
        onDisconnected: () => {
          connected = false;
          stopTimer();
          activeChannel = null;
          localMeter?.close(); localMeter = null;
          remoteMeter?.close(); remoteMeter = null;
          if (pendingUser) { pendingUser.pending = false; pendingUser = null; }
          if (pendingBot) { pendingBot.pending = false; pendingBot = null; }

          if (currentCall) {
            currentCall.durationMs = elapsed();
            currentCall.endedAt = Date.now();
            // No call-outcome server message ever arrived before disconnect:
            // same semantics as bot/main.py's own forced no_outcome fallback
            // on an unrecorded hangup (see on_client_disconnected there).
            currentCall.outcome = liveOutcome ?? { type: "no_outcome", reason: "call ended without a recorded outcome" };
            currentCall.callId = liveCallId;
            activeTab = "analysis";
            loadAnalysis(currentCall);
          }

          setCallScreenState("ended");
          capTime.textContent = fmtTime(currentCall ? currentCall.durationMs : 0);
          renderPanel();
        },
        onUserStartedSpeaking: () => {
          activeChannel = "local";
          setCallScreenState("listening");
          if (!pendingUser && currentCall) {
            pendingUser = { role: "user", text: "", t: elapsed(), pending: true };
            currentCall.transcript.push(pendingUser);
          }
          renderTranscript();
        },
        onUserStoppedSpeaking: () => {
          activeChannel = null;
          if (connected) setCallScreenState("connected-idle");
        },
        onUserInput: (data) => {
          if (!currentCall) return;
          if (!pendingUser) {
            pendingUser = { role: "user", text: "", t: elapsed(), pending: true };
            currentCall.transcript.push(pendingUser);
          }
          pendingUser.text = data.text ?? pendingUser.text;
          if (data.final) { pendingUser.pending = false; pendingUser = null; }
          renderTranscript();
        },
        onBotStartedSpeaking: () => {
          activeChannel = "remote";
          setCallScreenState("bot-speaking");
          if (!pendingBot && currentCall) {
            pendingBot = { role: "bot", text: "", t: elapsed(), pending: true };
            currentCall.transcript.push(pendingBot);
          }
          renderTranscript();
        },
        onBotStoppedSpeaking: () => {
          activeChannel = null;
          if (pendingBot) { pendingBot.pending = false; pendingBot = null; }
          if (connected) setCallScreenState("connected-idle");
          renderTranscript();
        },
        onBotOutput: (data) => {
          if (!data.text || !currentCall) return;
          if (!pendingBot) {
            pendingBot = { role: "bot", text: "", t: elapsed(), pending: true };
            currentCall.transcript.push(pendingBot);
          }
          if (data.text !== pendingBot.text) { pendingBot.text = data.text; renderTranscript(); }
        },
        onServerMessage: (data) => {
          // Populated once bot/main.py's record_outcome() sends it. Older
          // server builds never send this, in which case onDisconnected's
          // no_outcome fallback above covers it.
          if (data?.type === "call-outcome") liveOutcome = data.outcome;
          if (data?.type === "call-started") liveCallId = data.call_id;
        },
        onTrackStarted: (track, participant) => {
          if (track.kind !== "audio") return;
          const stream = new MediaStream([track]);
          if (participant?.local) {
            localMeter?.close();
            localMeter = new AudioLevelMeter(stream);
          } else {
            audioEl.srcObject = stream;
            remoteMeter?.close();
            remoteMeter = new AudioLevelMeter(stream);
          }
        },
        onError: (err) => showError("Connection error: " + JSON.stringify(err)),
      },
    });

    async function startCall() {
      clearError();
      currentCall = { id: newId(), startedAt: Date.now(), transcript: [], outcome: null, callId: null, analysis: null, analysisGaveUp: false, durationMs: 0, endedAt: null };
      liveOutcome = null;
      liveCallId = null;
      activeTab = "analysis";
      pendingUser = null;
      pendingBot = null;
      setCallScreenState("connecting");
      renderPanel();
      try {
        await client.connect({ webrtcRequestParams: { endpoint: "/api/offer" } });
      } catch (e) {
        currentCall = null;
        setCallScreenState("idle");
        renderPanel();
        showError("Could not connect: " + e);
      }
    }

    async function hangUp() {
      callBtn.disabled = true;
      await client.disconnect();
      callBtn.disabled = false;
    }

    // One button: Start Speaking when idle/ended, Hang Up during the call.
    callBtn.addEventListener("click", () => {
      const mode = callBtn.dataset.mode;
      if (mode === "start") startCall();
      else if (mode === "hangup") hangUp();
    });

    // ?call=<call_id> reopens a saved call's analysis (data/calls/), so a
    // reviewer can link straight to one instead of replaying it.
    async function openSavedCall(id) {
      const r = await fetch(`/api/calls/${encodeURIComponent(id)}/analysis`).catch(() => null);
      if (!r || !r.ok) { showError(`No saved analysis for call ${id}.`); return; }
      const a = await r.json();
      const rec = a.record;
      currentCall = {
        id, callId: id, startedAt: Date.parse(rec.started_at) || Date.now(),
        transcript: rec.transcript.map((t) => ({ role: t.role === "customer" ? "user" : "bot", text: t.text })),
        outcome: rec.outcome, analysis: a, analysisGaveUp: false,
        durationMs: (rec.duration_sec ?? 0) * 1000, endedAt: Date.now(),
      };
      activeTab = "analysis";
      renderPanel();
      if (a.status === "pending") loadAnalysis(currentCall);
    }

    renderPanel();
    const savedCallId = new URLSearchParams(location.search).get("call");
    if (savedCallId) openSavedCall(savedCallId);
  </script>
</body>
</html>
