<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mumbai Bank · Collections Console</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, monospace;

      --bg: #ffffff;
      --text: #0e1116;
      --text-dim: #6b7280;
      --text-faint: #9aa1ac;
      --border: #e7e9f0;
      --border-soft: #f0f1f6;

      --blue: #2f6feb;
      --blue-700: #1e4fc4;
      --blue-50: #eef4ff;
      --blue-200: #c6dafc;

      --green: #1fae6b;
      --green-50: #e9f8f0;

      --red: #e0453f;
      --red-50: #fdecec;

      --amber: #b45309;
      --amber-50: #fef5e7;

      --slate: #9aa1ac;
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      --radius-lg: 18px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 1px rgba(16, 24, 40, 0.03);
      --shadow-md: 0 10px 24px rgba(16, 24, 40, 0.08), 0 2px 6px rgba(16, 24, 40, 0.05);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body { font-family: var(--font); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    .app { max-width: 1080px; margin: 0 auto; padding: 28px 24px 56px; }

    @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ---------- brand header ---------- */
    .brand-bar {
      display: flex; align-items: center; gap: 16px;
      padding-bottom: 22px; margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
      animation: riseIn 0.55s var(--ease-smooth) both;
    }
    .logo-badge { flex-shrink: 0; filter: drop-shadow(0 4px 10px rgba(47, 111, 235, 0.3)); }
    .brand-name { font-weight: 700; font-size: 26px; letter-spacing: -0.01em; line-height: 1.15; }
    .brand-sub { font-size: 13.5px; color: var(--text-dim); margin-top: 2px; }

    /* ---------- layout ---------- */
    .layout { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: stretch; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

    .panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      animation: riseIn 0.55s var(--ease-smooth) both;
    }
    .panel-transcript { animation-delay: 0.14s; }

    /* ======================================================================
       Phone frame — simulated iOS incoming/in-call screen
       ====================================================================== */
    .phone-frame { animation: riseIn 0.55s var(--ease-smooth) both; animation-delay: 0.08s; }
    .phone-body {
      position: relative;
      height: 100%;
      background: linear-gradient(165deg, #2b2d33, #121317);
      border-radius: 44px;
      padding: 10px;
      box-shadow: var(--shadow-md), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }
    .phone-body::before, .phone-body::after {
      content: ""; position: absolute; width: 3px; background: #1a1b1f; border-radius: 2px;
    }
    .phone-body::before { left: -3px; top: 90px; height: 50px; } /* volume/action button hint */
    .phone-body::after { right: -3px; top: 120px; height: 70px; } /* power button hint */

    .phone-screen {
      position: relative;
      height: 100%;
      min-height: 480px;
      border-radius: 34px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #fff;
    }

    .screen-bg { position: absolute; inset: 0; background: #121319; overflow: hidden; }
    .screen-bg .blob {
      position: absolute; border-radius: 50%; filter: blur(46px);
      opacity: 0.85; transition: background 0.7s ease;
    }
    .screen-bg .b1 { width: 220px; height: 220px; top: -50px; left: -40px; background: var(--blob-1); animation: drift1 15s ease-in-out infinite alternate; }
    .screen-bg .b2 { width: 210px; height: 210px; bottom: 18%; right: -60px; background: var(--blob-2); animation: drift2 19s ease-in-out infinite alternate; }
    .screen-bg .b3 { width: 190px; height: 190px; bottom: -70px; left: 15%; background: var(--blob-3); animation: drift3 12s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(26px, 18px) scale(calc(1 + var(--level, 0) * 0.3)); } }
    @keyframes drift2 { from { transform: translate(0, 0) scale(1); } to { transform: translate(-22px, -16px) scale(calc(1 + var(--level, 0) * 0.3)); } }
    @keyframes drift3 { from { transform: translate(0, 0) scale(1); } to { transform: translate(18px, -22px) scale(calc(1 + var(--level, 0) * 0.25)); } }

    .phone-frame { --blob-1: #3a4252; --blob-2: #4a3c52; --blob-3: #52403a; }
    .phone-frame[data-state="connecting"] { --blob-1: #1d4ed8; --blob-2: #2f6feb; --blob-3: #1e4fc4; }
    .phone-frame[data-state="listening"], .phone-frame[data-state="connected-idle"] { --blob-1: #15935c; --blob-2: #1fae6b; --blob-3: #0f7a4c; }
    .phone-frame[data-state="bot-speaking"] { --blob-1: #2f6feb; --blob-2: #1e4fc4; --blob-3: #4c87f5; }
    .phone-frame[data-state="ended"] { --blob-1: #b23a35; --blob-2: #e0453f; --blob-3: #8f2e2a; }

    .dynamic-island {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 88px; height: 24px; background: #000; border-radius: 14px; z-index: 3;
    }

    .status-row {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px 0;
      font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    }
    .status-icons { display: flex; align-items: center; gap: 4px; color: #fff; }
    .status-icons svg { display: block; }
    .ic-signal { width: 15px; height: 10px; }
    .ic-wifi { width: 13px; height: 10px; }
    .ic-battery { width: 21px; height: 10px; }

    .caller-block { position: relative; z-index: 2; text-align: center; margin-top: 54px; padding: 0 16px; }
    .caller-number { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; }
    .caller-verify { margin-top: 10px; transition: opacity 0.25s ease; }
    .caller-verify[hidden] { display: none; }
    .tc-label { display: block; font-size: 11.5px; color: rgba(255, 255, 255, 0.55); }
    .tc-row { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 3px; font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, 0.92); }
    .tc-row svg { width: 14px; height: 14px; flex-shrink: 0; }

    .call-live-duration {
      font-family: var(--font-mono);
      font-size: 14px; margin-top: 8px; color: rgba(255, 255, 255, 0.75);
      font-variant-numeric: tabular-nums;
    }
    .call-live-duration[hidden] { display: none; }

    .call-ended-line { margin-top: 8px; font-size: 13px; font-weight: 600; color: #ff8d88; }
    .call-ended-line[hidden] { display: none; }

    .screen-spacer { flex: 1; }

    .quick-actions { position: relative; z-index: 2; display: flex; justify-content: space-evenly; padding: 0 24px 18px; }
    .quick-actions[hidden] { display: none; }
    .qa { display: flex; flex-direction: column; align-items: center; gap: 6px; color: rgba(255, 255, 255, 0.85); }
    .qa svg { width: 22px; height: 22px; }
    .qa span.qa-label { font-size: 11.5px; }

    .call-buttons { position: relative; z-index: 2; display: flex; justify-content: space-evenly; padding: 0 28px 20px; }
    .call-buttons.single { justify-content: center; }
    .call-buttons[hidden] { display: none; }
    .cb-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    button.cb {
      width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-md);
      transition: transform 0.16s var(--ease-spring), box-shadow 0.2s ease;
    }
    button.cb:hover { transform: translateY(-2px) scale(1.04); }
    button.cb:active { transform: translateY(0) scale(0.94); }
    button.cb svg { width: 23px; height: 23px; fill: #fff; }
    button.cb.accept { background: var(--green); }
    button.cb.decline { background: var(--red); }
    button.cb.decline svg { transform: rotate(135deg); }
    .cb-col .cb-label { font-size: 11.5px; color: rgba(255, 255, 255, 0.8); }

    @keyframes shake {
      10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-3px); } 40%, 60% { transform: translateX(3px); }
    }
    button.cb.shake { animation: shake 0.32s ease; }

    .home-indicator {
      position: relative; z-index: 2; align-self: center;
      width: 120px; height: 4px; border-radius: 3px;
      background: rgba(255, 255, 255, 0.55);
      margin-bottom: 10px;
    }

    /* ---------- right panel ---------- */
    .transcript-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      padding: 18px 22px; background: var(--blue-50);
      border-bottom: 1px solid var(--border-soft);
    }
    .th-left { display: flex; align-items: center; gap: 10px; }
    .th-left .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
    .transcript-head h2 { font-size: 15px; font-weight: 700; margin: 0; }
    button.toggle-btn {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1.5px solid var(--blue); cursor: pointer;
      background: #fff; color: var(--blue);
      font-size: 12.5px; font-weight: 600;
      padding: 7px 14px 7px 12px; border-radius: 99px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    button.toggle-btn svg { width: 14px; height: 14px; }
    button.toggle-btn:hover { background: var(--blue-50); }
    button.toggle-btn[aria-pressed="true"] { background: var(--blue); color: #fff; }

    .panel-transcript-body { padding: 0 22px 22px; min-height: 420px; }

    /* ---------- header tabs ---------- */
    .th-right { display: flex; align-items: center; gap: 8px; }
    .tabs { display: inline-flex; background: #fff; border: 1px solid var(--blue-200); border-radius: 99px; padding: 3px; }
    .tabs[hidden] { display: none; }
    .tabs button {
      border: none; background: transparent; cursor: pointer;
      font: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-dim);
      padding: 5px 14px; border-radius: 99px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .tabs button[aria-selected="true"] { background: var(--blue); color: #fff; }
    .tabs button:focus-visible, button.toggle-btn:focus-visible, .an-quote:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    button.toggle-btn[hidden] { display: none; }

    /* ---------- call analysis ---------- */
    #analysis { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; animation: msgIn 0.35s var(--ease-smooth); }
    #analysis[hidden] { display: none; }
    .an-k { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); font-weight: 600; }

    .an-hero { border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; background: #fcfcfd; }
    .an-hero-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .an-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--slate); flex-shrink: 0; align-self: center; }
    .an-hero-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .an-hero-detail { font-size: 14px; color: var(--text-dim); }
    .an-hero.tone-ok .an-dot { background: var(--green); }
    .an-hero.tone-info .an-dot { background: var(--blue); }
    .an-hero.tone-warn .an-dot { background: var(--amber); }
    .an-hero.tone-bad .an-dot { background: var(--red); }
    .an-meta { font-size: 12px; color: var(--text-faint); margin-top: 4px; font-variant-numeric: tabular-nums; }

    .an-follow {
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
      margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-md);
      background: var(--blue-50); border: 1px solid var(--blue-200);
    }
    .an-follow.none { background: #f7f8fa; border-color: var(--border-soft); }
    .an-follow-icon { width: 34px; height: 34px; border-radius: 9px; background: #fff; color: var(--blue); display: flex; align-items: center; justify-content: center; }
    .an-follow.none .an-follow-icon { color: var(--text-faint); }
    .an-follow-icon svg { width: 18px; height: 18px; }
    .an-follow-title { font-size: 14px; font-weight: 700; }
    .an-follow-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }
    @media (max-width: 560px) { .an-follow { grid-template-columns: auto 1fr; } .an-follow .chip { grid-column: 2; justify-self: start; } }

    .chip {
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
      background: #fff; color: var(--text-dim); border: 1px solid var(--border);
    }
    .chip.warn { background: var(--amber-50); color: var(--amber); border-color: #f6dfb8; }
    .chip.bad { background: var(--red-50); color: var(--red); border-color: #f7c9c7; }

    .an-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 900px) { .an-grid { grid-template-columns: 1fr; } }
    .an-card { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }

    .an-sent-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .sent-pill { font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 99px; background: #f1f2f5; color: var(--text-dim); }
    .sent-pill.frustrated { background: var(--red-50); color: var(--red); }
    .sent-pill.positive { background: var(--green-50); color: var(--green); }
    .sent-pill.neutral { background: #f1f2f5; color: #4b5563; }
    .an-traj { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); }
    .an-traj b { font-weight: 600; color: var(--text); }
    .an-traj .arrow { color: var(--text-faint); }
    .an-rationale { font-size: 13px; color: var(--text-dim); margin-top: 8px; line-height: 1.45; }
    .an-quotes { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .an-quote {
      text-align: left; font: inherit; cursor: pointer;
      border: none; border-left: 2px solid var(--green); background: #f8faf9;
      padding: 7px 10px; border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.45; color: var(--text);
    }
    .an-quote:hover { background: var(--green-50); }
    .an-quote .turn { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-faint); margin-top: 2px; }

    .an-dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 10px 0 0; font-size: 13px; }
    .an-dl dt { color: var(--text-faint); }
    .an-dl dd { margin: 0; font-weight: 600; }
    .an-dl dd .sub { display: block; font-weight: 400; font-size: 12px; color: var(--text-dim); margin-top: 1px; }
    .an-flags { display: flex; flex-wrap: wrap; gap: 6px; }
    .an-none { color: var(--text-faint); font-weight: 400; }

    .an-summary { font-size: 14px; line-height: 1.55; margin-top: 8px; }
    .an-foot { font-size: 11.5px; color: var(--text-faint); line-height: 1.5; }
    .an-note { font-size: 12.5px; color: var(--text-dim); padding: 10px 12px; border: 1px dashed var(--border); border-radius: var(--radius-md); }

    @keyframes shimmer { 0% { background-position: -300px 0; } 100% { background-position: 300px 0; } }
    .skel { border-radius: 6px; background: linear-gradient(90deg, #f1f2f5 0, #e8eaef 50%, #f1f2f5 100%); background-size: 600px 100%; animation: shimmer 1.3s linear infinite; }
    .skel.line { height: 12px; margin-top: 9px; }
    .skel.pill { height: 24px; width: 110px; margin-top: 8px; border-radius: 99px; }
    @media (prefers-reduced-motion: reduce) { .skel, #analysis { animation: none; } }

    .msg.highlight { background: var(--green-50); border-radius: 0 8px 8px 0; transition: background 0.4s ease; }

    .live-note { margin-top: 18px; padding: 10px 12px; border: 1px dashed var(--border); border-radius: var(--radius-md); font-size: 12px; color: var(--text-dim); }

    /* ---------- empty state ---------- */
    .empty-state { padding: 50px 10px 20px; text-align: center; }
    .empty-icon {
      width: 68px; height: 68px; margin: 0 auto 18px;
      border-radius: 50%; background: var(--blue-50);
      display: flex; align-items: center; justify-content: center;
      color: var(--blue);
      animation: riseIn 0.5s var(--ease-smooth) both;
    }
    .empty-icon svg { width: 26px; height: 26px; }
    .empty-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .empty-sub { font-size: 13px; color: var(--text-dim); margin-top: 5px; }

    /* ---------- transcript body ---------- */
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg { border-left: 2px solid transparent; padding: 7px 0 7px 14px; margin-bottom: 2px; font-size: 14px; line-height: 1.5; }
    .msg:last-child { animation: msgIn 0.28s var(--ease-smooth); }
    .msg .role { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; display: flex; gap: 8px; align-items: baseline; margin-bottom: 2px; }
    .msg .role .t { color: var(--text-faint); font-weight: 400; }
    .msg.user { border-color: var(--green); }
    .msg.user .role { color: var(--green); }
    .msg.bot { border-color: var(--blue); }
    .msg.bot .role { color: var(--blue); }
    .msg.pending { opacity: 0.65; }
    .msg.pending .text::after {
      content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 4px;
      border-radius: 50%; background: currentColor; animation: dotblink 0.9s ease-in-out infinite;
    }
    @keyframes dotblink { 50% { opacity: 0.2; } }

    #feed { display: flex; flex-direction: column; max-height: 420px; overflow-y: auto; margin-top: 18px; }
    #split { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; margin-top: 18px; }
    #split[hidden], #feed[hidden] { display: none; }
    #split .col-head { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding-bottom: 6px; margin-bottom: 8px; border-bottom: 1px solid var(--border-soft); }
    #split .col-customer .col-head { color: var(--green); border-bottom-color: var(--green); }
    #split .col-bot .col-head { color: var(--blue); border-bottom-color: var(--blue); }
    #split .col-body { max-height: 420px; overflow-y: auto; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

    .error-banner {
      margin-top: 14px; padding: 10px 14px;
      border: 1px solid var(--red); background: var(--red-50); color: var(--red);
      border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 12px;
      display: none;
    }
    .error-banner.show { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <header class="brand-bar">
      <svg class="logo-badge" width="52" height="52" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bankGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#4c87f5" />
            <stop offset="1" stop-color="#1e4fc4" />
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="13" fill="url(#bankGrad)" />
        <g transform="translate(9,12)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 6 15 0 30 6" />
          <line x1="1.5" y1="6" x2="28.5" y2="6" />
          <line x1="4" y1="9" x2="4" y2="19" />
          <line x1="10" y1="9" x2="10" y2="19" />
          <line x1="15" y1="9" x2="15" y2="19" />
          <line x1="20" y1="9" x2="20" y2="19" />
          <line x1="26" y1="9" x2="26" y2="19" />
          <line x1="-0.5" y1="22" x2="30.5" y2="22" />
        </g>
      </svg>
      <div>
        <div class="brand-name">Mumbai Bank</div>
        <div class="brand-sub">Credit card payment handling agent</div>
      </div>
    </header>

    <main class="layout">
      <section class="phone-frame" id="phoneFrame" data-state="idle">
        <div class="phone-body">
          <div class="phone-screen">
            <div class="screen-bg">
              <span class="blob b1"></span>
              <span class="blob b2"></span>
              <span class="blob b3"></span>
            </div>
            <div class="dynamic-island"></div>

            <div class="status-row">
              <span id="statusClock">9:41</span>
              <span class="status-icons">
                <svg class="ic-signal" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="5" y="5" width="3" height="7" rx="0.6"/><rect x="10" y="3" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="12" rx="0.6"/></svg>

                <svg class="ic-battery" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="18" height="8" rx="1.3" fill="currentColor"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>

      <section class="panel panel-transcript">

          <div class="th-right">

              <button type="button" role="tab" id="tabAnalysis" aria-selected="true">Analysis</button>
              <button type="button" role="tab" id="tabTranscript" aria-selected="false">Transcript</button>

              <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="6" height="12" rx="1.5" fill="currentColor"/><rect x="9" y="2" width="6" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/></svg>
              Split view

        <div class="panel-transcript-body">
          <div class="live-note" id="liveNote" hidden>Call in progress — the call analysis replaces this transcript when the call ends.</div>

    </main>
  </div>

  <script type="module">
    import { PipecatClient } from "https://cdn.jsdelivr.net/npm/@pipecat-ai/client-js@1.15.0/+esm";
    import { SmallWebRTCTransport } from "https://cdn.jsdelivr.net/npm/@pipecat-ai/small-webrtc-transport@1.11.1/+esm";

    const el = (id) => document.getElementById(id);
    const phoneFrame = el("phoneFrame");
    const statusClock = el("statusClock");
    const callerVerify = el("callerVerify");
    const callLiveDuration = el("callLiveDuration");
    const endedLine = el("endedLine");
    const quickActions = el("quickActions");
    const ringButtons = el("ringButtons");
    const endButtons = el("endButtons");
    const acceptBtn = el("acceptBtn");
    const declineBtn = el("declineBtn");
    const endBtn = el("endBtn");
    const splitBtn = el("splitBtn");
    const panelTitle = el("panelTitle");
    const tabsEl = el("tabs");
    const tabAnalysis = el("tabAnalysis");
    const tabTranscript = el("tabTranscript");
    const analysisEl = el("analysis");
    const liveNote = el("liveNote");
    const feedEl = el("feed");
    const splitEl = el("split");
    const colCustomerEl = el("colCustomer");
    const colBotEl = el("colBot");
    const errorBanner = el("errorBanner");

    const WAVEFORM_ICON = '<svg viewBox="0 0 24 24" fill="none"><rect x="1.5" y="9" width="2.6" height="6" rx="1.3" fill="currentColor"/><rect x="7" y="5" width="2.6" height="14" rx="1.3" fill="currentColor"/><rect x="12.5" y="2" width="2.6" height="20" rx="1.3" fill="currentColor"/><rect x="18" y="6" width="2.6" height="12" rx="1.3" fill="currentColor"/></svg>';

    // --- iOS-style status clock (real time, no AM/PM, like the status bar) ---
    function updateClock() {
      let h = new Date().getHours() % 12;
      if (h === 0) h = 12;
      const m = String(new Date().getMinutes()).padStart(2, "0");
      statusClock.textContent = `${h}:${m}`;
    }
    updateClock();
    setInterval(updateClock, 15000);

    function setCallScreenState(state) {
      if (phoneFrame.dataset.state === state) return;
      phoneFrame.dataset.state = state;

      const ringing = state === "idle" || state === "ended";
      const inCall = !ringing;

      ringButtons.hidden = !ringing;
      endButtons.hidden = ringing;
      quickActions.hidden = !ringing;
      callerVerify.hidden = inCall || state === "ended";
      callLiveDuration.hidden = !inCall;
      endedLine.hidden = state !== "ended";

      if (state === "connecting") callLiveDuration.textContent = "Calling…";
    }
    declineBtn.addEventListener("click", () => {
      declineBtn.classList.add("shake");
      setTimeout(() => declineBtn.classList.remove("shake"), 320);
    });

    // Only used when the server never returns an analysis (older bot.main
    // build, or the call never reached the server).
    const OUTCOME_LABELS = {
      promise_to_pay: "Promise to pay",
      already_paid: "Already paid",
      callback_request: "Callback requested",
      dispute_transfer: "Dispute — transferred",
      no_outcome: "No outcome",
    };

    function fmtTime(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const m = String(Math.floor(total / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      return `${m}:${s}`;
    }
    function fmtClock(ms) {
      return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }
    function newId() {
      return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
    }
    function fmtDate(iso, opts = { weekday: "short", day: "numeric", month: "short" }) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString(undefined, opts);
    }
    function relativeDay(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const days = Math.round((new Date(y, m - 1, d) - today) / 86400000);
      if (days === 0) return "today";
      if (days === 1) return "tomorrow";
      if (days === -1) return "yesterday";
      return days > 0 ? `in ${days} days` : `${-days} days ago`;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // --- call record ---
    let currentCall = null; // the call in progress (or just-ended, before being superseded by a new one)
    let splitMode = false;
    let pendingUser = null;
    let pendingBot = null;
    let callStartedAt = null;
    let timerInterval = null;
    let liveOutcome = null;
    let liveCallId = null;
    let connected = false;
    let activeTab = "analysis"; // after a call ends: "analysis" | "transcript"

    function elapsed() { return callStartedAt ? Date.now() - callStartedAt : 0; }

    function startTimer() {
      callStartedAt = Date.now();
      timerInterval = setInterval(() => {
        const t = fmtTime(elapsed());
        callLiveDuration.textContent = t;
      }, 250);
    }
    function stopTimer() { clearInterval(timerInterval); timerInterval = null; }

    // --- transcript rendering ---
    function messageHtml(m) {
      const roleLabel = m.role === "user" ? "Customer" : "Mumbai Bank bot";
      return `<div class="msg ${m.role}${m.pending ? " pending" : ""}" data-idx="${m.idx ?? ""}">
        <div class="role">${roleLabel}${m.t != null ? ` <span class="t">${fmtTime(m.t)}</span>` : ""}</div>
        <div class="text">${escapeHtml(m.text || "")}</div>
      </div>`;
    }
    const EMPTY_STATE_HTML = `
      <div class="empty-state">
        <div class="empty-icon">${WAVEFORM_ICON}</div>
        <div class="empty-title">Your conversation will appear here</div>
        <div class="empty-sub">Start a call to see the transcript in real time.</div>
      </div>`;

    function renderTranscript() {
      // A late transport event after hangup must not draw the feed over the analysis tab.
      if (currentCall?.endedAt && activeTab === "analysis") return;
      const messages = currentCall ? currentCall.transcript.map((m, idx) => ({ ...m, idx })) : [];

      if (messages.length === 0) {
        feedEl.innerHTML = EMPTY_STATE_HTML;
        colCustomerEl.innerHTML = "";
        colBotEl.innerHTML = "";
      } else if (splitMode) {
        colCustomerEl.innerHTML = messages.filter((m) => m.role === "user").map(messageHtml).join("");
        colBotEl.innerHTML = messages.filter((m) => m.role === "bot").map(messageHtml).join("");
        colCustomerEl.scrollTop = colCustomerEl.scrollHeight;
        colBotEl.scrollTop = colBotEl.scrollHeight;
      } else {
        feedEl.innerHTML = messages.map(messageHtml).join("");
        feedEl.scrollTop = feedEl.scrollHeight;
      }
      feedEl.hidden = splitMode;
      splitEl.hidden = !splitMode;
    }

    const CALENDAR_ICON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4.5" width="14" height="12.5" rx="2.5"/><path d="M3 8.5h14M7 2.5v3.5M13 2.5v3.5"/></svg>';
    const NO_CALL_ICON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M5.5 14.5l9-9"/></svg>';
    const SENTIMENT_LABELS = { frustrated: "Frustrated", neutral: "Neutral", positive: "Positive", unclear: "Unclear" };
    const DATE_SOURCE_LABELS = {
      customer: "Customer's words",
      promise_date: "Day after promised date",
      verification_window: "Payment posting window",
      retry_policy: "Retry policy",
      default_sla: "Default SLA · no date given",
    };
    const OUTCOME_TONE = { promise_to_pay: "ok", already_paid: "ok", callback_request: "info", dispute_transfer: "warn", no_outcome: "bad" };
    const FLAG_TONE = { abuse_detected: "bad", legal_threat: "bad", guardrail_triggered: "bad", hardship_disclosed: "warn" };

    function prettyDates(text) {
      return escapeHtml(text || "").replace(/\b(\d{4}-\d{2}-\d{2})\b/g, (iso) => fmtDate(iso, { day: "numeric", month: "short" }));
    }

    function renderPanel() {
      const call = currentCall;
      const ended = !!call && !!call.endedAt;

      liveNote.hidden = !call || ended;
      tabsEl.hidden = !ended;
      panelTitle.textContent = ended ? "Call analysis" : "Live transcript";
      const showAnalysis = ended && activeTab === "analysis";
      tabAnalysis.setAttribute("aria-selected", String(showAnalysis));
      tabTranscript.setAttribute("aria-selected", String(ended && !showAnalysis));
      splitBtn.hidden = showAnalysis;
      analysisEl.hidden = !showAnalysis;

      if (showAnalysis) {
        feedEl.hidden = true;
        splitEl.hidden = true;
        renderAnalysis();
      } else {
        renderTranscript();
      }
    }

    function skeletonCard(title) {
      return `<section class="an-card"><div class="an-k">${title}</div><div class="skel pill"></div><div class="skel line" style="width:92%"></div><div class="skel line" style="width:70%"></div></section>`;
    }

    function renderAnalysis() {
      const call = currentCall;
      const a = call.analysis;
      const customerTurns = call.transcript.filter((m) => m.role === "user").length;
      const meta = `${fmtTime(call.durationMs ?? 0)} call · ${customerTurns} customer turn${customerTurns === 1 ? "" : "s"}`;

      if (!a || !a.workflow) {
        if (!call.analysisGaveUp) {
          analysisEl.innerHTML = `
            <section class="an-hero"><div class="an-k">Outcome</div><div class="skel line" style="width:45%;height:20px"></div><div class="skel line" style="width:30%"></div></section>
            <div class="an-grid">${skeletonCard("Customer sentiment")}${skeletonCard("Workflow")}</div>`;
          return;
        }
        // Server never answered: show what the client itself knows, and say so.
        const o = call.outcome ?? { type: "no_outcome" };
        analysisEl.innerHTML = `
          <section class="an-hero tone-${OUTCOME_TONE[o.type] ?? "bad"}">
            <div class="an-k">Outcome</div>
            <div class="an-hero-row"><span class="an-dot"></span><span class="an-hero-title">${OUTCOME_LABELS[o.type] ?? escapeHtml(o.type)}</span></div>
            <div class="an-meta">${meta}</div>
          </section>
          <div class="an-note">Analysis unavailable — the server didn't return one for this call. Restart <code>bot.main</code> if it predates the post-call analysis.</div>`;
        return;
      }

      const wf = a.workflow;
      const fu = wf.follow_up;
      const followHtml = fu.needed
        ? `<div class="an-follow">
             <div class="an-follow-icon">${CALENDAR_ICON}</div>
             <div><div class="an-follow-title">Follow-up ${fu.date ? `· ${fmtDate(fu.date)} <span class="an-none">(${relativeDay(fu.date)})</span>` : ""}</div><div class="an-follow-sub">${escapeHtml(fu.reason)}</div></div>
             <span class="chip ${fu.date_source === "default_sla" ? "warn" : ""}">${DATE_SOURCE_LABELS[fu.date_source] ?? ""}</span>
           </div>`
        : `<div class="an-follow none">
             <div class="an-follow-icon">${NO_CALL_ICON}</div>
             <div><div class="an-follow-title">No follow-up call</div><div class="an-follow-sub">${escapeHtml(fu.reason)}</div></div>
           </div>`;

      const flagsHtml = wf.flags.length
        ? `<div class="an-flags">${wf.flags.map((f) => `<span class="chip ${FLAG_TONE[f.key] ?? ""}">${escapeHtml(f.label)}</span>`).join("")}</div>`
        : `<span class="an-none">None</span>`;

      let sentimentHtml;
      const sent = a.sentiment;
      if (a.status === "pending") {
        sentimentHtml = `<div class="skel pill"></div><div class="skel line" style="width:92%"></div><div class="skel line" style="width:70%"></div>`;
      } else if (!sent) {
        sentimentHtml = `<div class="an-rationale">Sentiment analysis failed for this call. Outcome, follow-up and stage above are unaffected.</div>`;
      } else {
        const traj = sent.start !== sent.end
          ? `<span class="an-traj"><b>${SENTIMENT_LABELS[sent.start]}</b><span class="arrow">→</span><b>${SENTIMENT_LABELS[sent.end]}</b></span>`
          : `<span class="an-traj">Steady through the call</span>`;
        const quotes = sent.evidence.map((e) =>
          `<button type="button" class="an-quote" data-quote="${escapeHtml(e.quote)}">“${escapeHtml(e.quote)}”<span class="turn">Turn ${e.turn + 1} · show in transcript</span></button>`
        ).join("");
        sentimentHtml = `
          <div class="an-sent-row"><span class="sent-pill ${sent.overall}">${SENTIMENT_LABELS[sent.overall]}</span>${traj}</div>
          <div class="an-rationale">${escapeHtml(sent.rationale)}</div>
          ${quotes ? `<div class="an-quotes">${quotes}</div>` : ""}`;
      }

      const summaryHtml = a.status === "pending"
        ? `<div class="skel line" style="width:96%"></div><div class="skel line" style="width:88%"></div>`
        : sent ? `<div class="an-summary">${escapeHtml(sent.summary)}</div>` : `<div class="an-rationale">Unavailable.</div>`;

      analysisEl.innerHTML = `
        <section class="an-hero tone-${OUTCOME_TONE[wf.outcome.type] ?? "bad"}">
          <div class="an-k">Outcome</div>
          <div class="an-hero-row"><span class="an-dot"></span><span class="an-hero-title">${escapeHtml(wf.outcome.label)}</span><span class="an-hero-detail">${prettyDates(wf.outcome.detail)}</span></div>
          <div class="an-meta">${meta}</div>
          ${followHtml}
        </section>
        <div class="an-grid">
          <section class="an-card"><div class="an-k">Customer sentiment</div>${sentimentHtml}</section>
          <section class="an-card">
            <div class="an-k">Workflow</div>
            <dl class="an-dl">
              <dt>Stage</dt><dd>${escapeHtml(wf.stage.label)}${wf.stage.overridden_from ? `<span class="sub">Outcome alone would have been: ${escapeHtml(wf.stage.overridden_from)}</span>` : ""}</dd>
              <dt>Routed to</dt><dd>${escapeHtml(wf.stage.team)}</dd>
              <dt>Flags</dt><dd>${flagsHtml}</dd>
            </dl>
          </section>
        </div>
        <section class="an-card"><div class="an-k">Summary</div>${summaryHtml}</section>
        <div class="an-foot">Sentiment and summary by ${escapeHtml(sent?.model ?? "gpt-4o")}, with quotes checked against the transcript. Outcome, follow-up and stage come from fixed rules on the recorded outcome, not the model.${call.callId ? ` · <a href="?call=${encodeURIComponent(call.callId)}">Link to this call</a>` : ""}</div>`;
    }

    function normQuote(t) { return t.toLowerCase().replace(/[^\w\s']/g, " ").replace(/\s+/g, " ").trim(); }

    analysisEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".an-quote");
      if (!btn) return;
      const q = normQuote(btn.dataset.quote);
      const idx = currentCall.transcript.findIndex((m) => m.role === "user" && normQuote(m.text || "").includes(q));
      setTab("transcript");
      if (idx < 0) return;
      const node = (splitMode ? colCustomerEl : feedEl).querySelector(`.msg[data-idx="${idx}"]`);
      if (!node) return;
      node.scrollIntoView({ block: "center", behavior: "smooth" });
      node.classList.add("highlight");
      setTimeout(() => node.classList.remove("highlight"), 2200);
    });

    function setTab(tab) { activeTab = tab; renderPanel(); }
    tabAnalysis.addEventListener("click", () => setTab("analysis"));
    tabTranscript.addEventListener("click", () => setTab("transcript"));

    // Polls the server for this call's analysis. The data channel is gone by
    // the time the call ends, so this is a plain HTTP fetch keyed by the
    // call_id the bot sent in its "call-started" message.
    async function loadAnalysis(call) {
      const deadline = Date.now() + 25000;
      while (Date.now() < deadline && currentCall === call) {
        if (call.callId) {
          try {
            const r = await fetch(`/api/calls/${encodeURIComponent(call.callId)}/analysis`);
            if (r.ok) {
              call.analysis = await r.json();
              if (currentCall === call) renderPanel();
              if (call.analysis.status !== "pending") return;
            }
          } catch { /* server restarting — keep trying until the deadline */ }
        }
        await new Promise((res) => setTimeout(res, 1000));
      }
      if (currentCall === call && (!call.analysis || call.analysis.status === "pending")) {
        call.analysisGaveUp = true;
        renderPanel();
      }
    }

    function renderAll() { renderPanel(); }

    splitBtn.addEventListener("click", () => {
      splitMode = !splitMode;
      splitBtn.setAttribute("aria-pressed", String(splitMode));
      renderPanel();
    });

    function showError(text) { errorBanner.textContent = text; errorBanner.classList.add("show"); }
    function clearError() { errorBanner.classList.remove("show"); errorBanner.textContent = ""; }

    // --- audio-reactive level, drives the blurred background blobs ---
    class AudioLevelMeter {
      constructor(stream) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new Ctx();
        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 512;
        this.analyser.smoothingTimeConstant = 0.6;
        this.ctx.createMediaStreamSource(stream).connect(this.analyser);
        this.data = new Uint8Array(this.analyser.frequencyBinCount);
      }
      level() {
        this.analyser.getByteTimeDomainData(this.data);
        let sumSquares = 0;
        for (let i = 0; i < this.data.length; i++) {
          const n = (this.data[i] - 128) / 128;
          sumSquares += n * n;
        }
        return Math.min(1, Math.sqrt(sumSquares / this.data.length) * 4);
      }
      close() { this.ctx.close().catch(() => {}); }
    }

    let localMeter = null;
    let remoteMeter = null;
    let activeChannel = null; // "local" | "remote" | null

    (function levelLoop() {
      let level = 0;
      if (activeChannel === "local" && localMeter) level = localMeter.level();
      else if (activeChannel === "remote" && remoteMeter) level = remoteMeter.level();
      phoneFrame.style.setProperty("--level", level.toFixed(3));
      requestAnimationFrame(levelLoop);
    })();

    let audioEl = document.querySelector("audio#botAudio");
    if (!audioEl) {
      audioEl = document.createElement("audio");
      audioEl.id = "botAudio";
      audioEl.autoplay = true;
      audioEl.style.display = "none";
      document.body.appendChild(audioEl);
    }

    const client = new PipecatClient({
      transport: new SmallWebRTCTransport(),
      enableMic: true,
      enableCam: false,
      callbacks: {
        onConnected: () => {
          connected = true;
          clearError();
          startTimer();
          setCallScreenState("connected-idle");
        },
        onDisconnected: () => {
          connected = false;
          stopTimer();
          activeChannel = null;
          localMeter?.close(); localMeter = null;
          remoteMeter?.close(); remoteMeter = null;
          if (pendingUser) { pendingUser.pending = false; pendingUser = null; }
          if (pendingBot) { pendingBot.pending = false; pendingBot = null; }

          if (currentCall) {
            currentCall.durationMs = elapsed();
            currentCall.endedAt = Date.now();
            // No call-outcome server message ever arrived before disconnect:
            // same semantics as bot/main.py's own forced no_outcome fallback
            // on an unrecorded hangup (see on_client_disconnected there).
            currentCall.outcome = liveOutcome ?? { type: "no_outcome", reason: "call ended without a recorded outcome" };
            currentCall.callId = liveCallId;
            activeTab = "analysis";
            loadAnalysis(currentCall);
          }

          setCallScreenState("ended");
          endedLine.textContent = `Call ended · ${fmtTime(currentCall ? currentCall.durationMs : 0)}`;
          renderAll();
        },
        onUserStartedSpeaking: () => {
          activeChannel = "local";
          setCallScreenState("listening");
          if (!pendingUser && currentCall) {
            pendingUser = { role: "user", text: "", t: elapsed(), pending: true };
            currentCall.transcript.push(pendingUser);
          }
          renderTranscript();
        },
        onUserStoppedSpeaking: () => {
          activeChannel = null;
          if (connected) setCallScreenState("connected-idle");
        },
        onUserInput: (data) => {
          if (!currentCall) return;
          if (!pendingUser) {
            pendingUser = { role: "user", text: "", t: elapsed(), pending: true };
            currentCall.transcript.push(pendingUser);
          }
          pendingUser.text = data.text ?? pendingUser.text;
          if (data.final) { pendingUser.pending = false; pendingUser = null; }
          renderTranscript();
        },
        onBotStartedSpeaking: () => {
          activeChannel = "remote";
          setCallScreenState("bot-speaking");
          if (!pendingBot && currentCall) {
            pendingBot = { role: "bot", text: "", t: elapsed(), pending: true };
            currentCall.transcript.push(pendingBot);
          }
          renderTranscript();
        },
        onBotStoppedSpeaking: () => {
          activeChannel = null;
          if (pendingBot) { pendingBot.pending = false; pendingBot = null; }
          if (connected) setCallScreenState("connected-idle");
          renderTranscript();
        },
        onBotOutput: (data) => {
          if (!data.text || !currentCall) return;
          if (!pendingBot) {
            pendingBot = { role: "bot", text: "", t: elapsed(), pending: true };
            currentCall.transcript.push(pendingBot);
          }
          if (data.text !== pendingBot.text) { pendingBot.text = data.text; renderTranscript(); }
        },
        onServerMessage: (data) => {
          // Populated once bot/main.py's record_outcome() sends it. Older
          // server builds never send this, in which case onDisconnected's
          // no_outcome fallback above covers it.
          if (data?.type === "call-outcome") liveOutcome = data.outcome;
          if (data?.type === "call-started") liveCallId = data.call_id;
        },
        onTrackStarted: (track, participant) => {
          if (track.kind !== "audio") return;
          const stream = new MediaStream([track]);
          if (participant?.local) {
            localMeter?.close();
            localMeter = new AudioLevelMeter(stream);
          } else {
            audioEl.srcObject = stream;
            remoteMeter?.close();
            remoteMeter = new AudioLevelMeter(stream);
          }
        },
        onError: (err) => showError("Connection error: " + JSON.stringify(err)),
      },
    });

    acceptBtn.addEventListener("click", async () => {
      clearError();
      currentCall = { id: newId(), startedAt: Date.now(), transcript: [], outcome: null, callId: null, analysis: null, analysisGaveUp: false, durationMs: 0, endedAt: null };
      liveOutcome = null;
      liveCallId = null;
      activeTab = "analysis";
      pendingUser = null;
      pendingBot = null;
      splitMode = false;
      splitBtn.setAttribute("aria-pressed", "false");
      renderAll();
      setCallScreenState("connecting");
      try {
        await client.connect({ webrtcRequestParams: { endpoint: "/api/offer" } });
      } catch (e) {
        setCallScreenState("idle");
        showError("Could not connect: " + e);
      }
    });

    endBtn.addEventListener("click", async () => {
      endBtn.disabled = true;
      await client.disconnect();
      endBtn.disabled = false;
    });

    // ?call=<call_id> reopens a saved call's analysis (data/calls/), so a
    // reviewer can link straight to one instead of replaying it.
    async function openSavedCall(id) {
      const r = await fetch(`/api/calls/${encodeURIComponent(id)}/analysis`).catch(() => null);
      if (!r || !r.ok) { showError(`No saved analysis for call ${id}.`); return; }
      const a = await r.json();
      const rec = a.record;
      currentCall = {
        id, callId: id, startedAt: Date.parse(rec.started_at) || Date.now(),
        transcript: rec.transcript.map((t) => ({ role: t.role === "customer" ? "user" : "bot", text: t.text })),
        outcome: rec.outcome, analysis: a, analysisGaveUp: false,
        durationMs: (rec.duration_sec ?? 0) * 1000, endedAt: Date.now(),
      };
      activeTab = "analysis";
      renderAll();
      if (a.status === "pending") loadAnalysis(currentCall);
    }

    renderAll();
    const savedCallId = new URLSearchParams(location.search).get("call");
    if (savedCallId) openSavedCall(savedCallId);
  </script>
</body>
</html>
